plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("MARCHKOV_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("MARCHKOV_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("MARCHKOV_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MARCHKOV_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.isEmpty() }

android {
    namespace = "com.variantconst.marchkov_helper"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.variantconst.marchkov_helper"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        jniLibs {
            // GitHub distributes a universal APK directly, so keep native
            // libraries compressed to avoid doubling the download size.
            useLegacyPackaging true
        }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def hasReleaseTask = graph.allTasks.any {
        it.name.toLowerCase().contains("release")
    }
    if (hasReleaseTask && !releaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set the MARCHKOV_KEYSTORE_* environment variables."
        )
    }
}

flutter {
    source = "../.."
}
